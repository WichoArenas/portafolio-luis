name: Update certifications

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 15:00 UTC
    - cron: "0 15 * * 1"

  push:
    paths:
      - "src/data/certifications-sources.json"
      - "scripts/update_certifications.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-certifications.yml"

permissions:
  contents: write

concurrency:
  group: update-certifications
  cancel-in-progress: false

jobs:
  update-certifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update certifications JSON
        run: npm run update:certs

      - name: Show generated changes
        run: git status --short

      - name: Commit updated certifications
        run: |
          if [[ -n "$(git status --porcelain src/data/certifications.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/certifications.json
            git commit -m "Update certification metadata"
            git push
          else
            echo "No certification changes detected."
          fi